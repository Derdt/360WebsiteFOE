<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus — Faculty of Engineering, NUOL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Kanit:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/campus.css">

  <!-- The import map must come BEFORE any module script. It also makes sure the whole
       site uses one single copy of three.js (do not import three from unpkg elsewhere). -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/0.179.1/build/three.module.js",
      "three/addons/": "./vendor/three/0.179.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="stage"></div>
  <div id="pins"></div>
  <div id="tooltip"></div>

  <!-- <header class="brand card">
    <h1>Faculty of Engineering</h1>
    <p>National University of Laos</p>
    <a class="menu-link" href="index.html">← Menu</a>
  </header> -->

  <p id="hint" class="card">Drag to look around, scroll or pinch to zoom, tap a pin</p>



  <button id="overviewBtn" class="overview-btn on" type="button">Overview</button>

  <div id="fallback" hidden></div>
  <script type="module" src="js/campus-app.js"></script>
  <script>
    // If the 3D map has not started after 20 s (script blocked, very slow network, no WebGL),
    // show a message instead of leaving visitors with a blank screen.
    setTimeout(function () {
      if (document.querySelector('#stage canvas')) return;
      var f = document.getElementById('fallback');
      if (f && f.hidden) {
        f.textContent = 'The 3D campus map could not start. Please check your internet connection and reload the page, or try another browser (Chrome, Edge, Safari or Firefox).';
        f.hidden = false;
      }
    }, 20000);
  </script>
</body>

</html>
