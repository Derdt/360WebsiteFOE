<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Map VR — Faculty of Engineering, NUOL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Kanit:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Fredoka', 'Kanit', ui-rounded, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(180deg, #4f6fd8 0%, #4f6fd8 14%, #eaf4ff 32%, #8cc3f0 68%, #1e6fc4 100%);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }

  .card {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
  }

  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 22px;
  }
  .logos img {
    height: 84px;
    width: 84px;
    object-fit: contain;
  }

  h1 {
    margin: 0;
    font-size: clamp(22px, 5.5vw, 30px);
    font-weight: 600;
    line-height: 1.3;
    color: #fff;
    text-shadow: 0 2px 10px rgba(10, 40, 90, 0.25);
  }
  h1 + h1 { margin-top: 2px; }

  .start-btn {
    margin-top: 34px;
    display: inline-block;
    padding: 14px 46px;
    border-radius: 999px;
    background: #fff;
    color: #1e88e5;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(10, 40, 90, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(10, 40, 90, 0.3); }
  .start-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logos">
      <img src="images/Logo_NUOL-ORiginal.png" alt="National University of Laos logo" onerror="this.style.display='none'">
      <img src="images/cropped-FEN-Logo.drawio-1.png" alt="Faculty of Engineering logo" onerror="this.style.display='none'">
    </div>
    <h1>The Map VR of Faculty of Engineering</h1>
    <h1>National University of Laos</h1>
    <a class="start-btn" href="campus.html">Start</a>
  </div>
</body>
</html>
