<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Engineering VR</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        /* Floor-dot navigation for this panorama page (Street-View style). */
        #hotspots { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
        .hotspot {
            position: absolute; left: 0; top: 0;
            width: 46px; height: 46px;
            margin: -23px 0 0 -23px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            padding: 0;
            cursor: pointer;
            pointer-events: auto;
            animation: hotspotPulse 1.8s ease-in-out infinite;
            transition: background 0.2s, transform 0.15s;
        }
        .hotspot:hover { background: rgba(255, 255, 255, 0.5); transform: scale(1.12); }
        .hotspot:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        @keyframes hotspotPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.35); }
            50% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
        }
        @media (prefers-reduced-motion: reduce) { .hotspot { animation: none; } }
    </style>


</head>

<body>
    <button id="backToCampus">Back</button>

    <div id="viewer"></div>

    <div id="overlay">

        <div id="popup">

            <img id="popupImage">

            <h2 id="popupTitle"></h2>

            <p id="popupText"></p>

            <button id="closePopup">

                Close

            </button>

        </div>

    </div>

    <script type="module" src="../js/engineering.js"></script>
    <script type="importmap">
            {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
            }
        }
    </script>
</body>

</html>
